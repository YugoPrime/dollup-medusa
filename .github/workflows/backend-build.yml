name: Backend Build

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        # onnxruntime-node 1.17.3 (via @imgly/background-removal-node) downloads
        # CUDA binaries from github.com/microsoft/onnxruntime releases on
        # linux x64; that repo 404s since Nov 2026 and fails the install.
        # No GPU anywhere we run, so skip them.
        env:
          npm_config_onnxruntime_node_install_cuda: skip
        run: yarn install --immutable

      - name: Build
        run: yarn build
